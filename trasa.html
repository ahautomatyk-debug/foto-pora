<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FotoPora – Mapa Trasy</title>
<script>
document.write('<link rel="stylesheet" href="https://'+'cdnjs.'+'cloudflare.com'+'/ajax/libs/leaflet/1.9.4/leaflet.min.css">');
document.write('<script src="https://'+'cdnjs.'+'cloudflare.com'+'/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>');
</script>


<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:16px}
main{max-width:500px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
a.back{color:#ffd166;text-decoration:none;font-weight:bold;background:#202126;padding:10px 14px;border-radius:12px}
.card{background:#202126;border-radius:18px;padding:14px;margin:12px 0}
#map{width:100%;height:340px;border-radius:14px;background:#1b1c20;z-index:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:#303138;border-radius:12px;padding:12px}
.tile b{display:block;font-size:20px;margin-top:4px}
.btns{display:flex;gap:10px;margin-top:12px}
button{flex:1;padding:16px;border:0;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer}
.start{background:#70e69a;color:#111}
.stop{background:#ff7777;color:#111}
.clear{background:#303138;color:#fff;margin-top:10px;width:100%}
</style>
</head>
<body>
<main>
<div class="top" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
 <h2 style="margin:0;font-size:20px">🗺️ Mapa Trasy</h2>
 <div style="display:flex;gap:8px;align-items:center">
  <button id="mapNightBtn" onclick="toggleMapNight()" style="padding:8px 12px;border-radius:12px;border:1px solid #393a40;background:#202126;color:#ff6666;font-weight:bold;font-size:13px;cursor:pointer;width:auto">🔦 Noc</button>
  <a href="index.html" class="back" style="margin:0">← FotoPora</a>
 </div>
</div>


<div class="card">
 <div id="map"></div>
 <small style="color:#aaa;display:block;margin-top:8px">🟢 Start • 🔵 Ty • 🔴 Przebyta trasa na mapie</small>
 <div class="grid">
  <div class="tile">📏 Dystans<b id="dist">0 m</b></div>
  <div class="tile">🎯 Do startu<b id="toStart">—</b></div>
 </div>
</div>

<div class="btns">
 <button class="start" onclick="startTrack()">▶ START TRASY</button>
 <button class="stop" onclick="stopTrack()">⏹ STOP</button>
</div>
<button class="clear" onclick="clearTrack()">🗑️ Wyczyść zapisaną trasę</button>
<p id="status" style="color:#bbb;font-size:14px">Kliknij START, aby pobrać pozycję na mapie.</p>
</main>

<script>
const $=id=>document.getElementById(id);
let points=JSON.parse(localStorage.getItem("fp_track")||"[]");
let watchId=null;

const map=L.map("map").setView([49.75,18.63],14);
const tileUrl="https://"+"a."+"tile.openstreetmap.org"+"/{z}/{x}/{y}.png";

L.tileLayer(tileUrl,{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);

const line=L.polyline([],{color:"#ff4444",weight:5}).addTo(map);
const startPin=L.circleMarker([49.75,18.63],{radius:7,color:"#111",fillColor:"#70e69a",fillOpacity:1});
const mePin=L.circleMarker([49.75,18.63],{radius:8,color:"#fff",fillColor:"#3b82f6",fillOpacity:1});

function calcDist(p1,p2){
 const R=6371000,p=Math.PI/180;
 const lat1=p1[0],lon1=p1[1],lat2=p2[0],lon2=p2[1];
 const a=0.5-Math.cos((lat2-lat1)*p)/2+Math.cos(lat1*p)*Math.cos(lat2*p)*(1-Math.cos((lon2-lon1)*p))/2;
 return 2*R*Math.asin(Math.sqrt(a));
}

function updateMap(centerMe){
 if(!points.length){$("dist").textContent="0 m";$("toStart").textContent="—";line.setLatLngs([]);startPin.remove();mePin.remove();return;}
 let total=0;
 for(let i=1;i<points.length;i++) total+=calcDist(points[i-1],points[i]);
 $("dist").textContent=total>1000?(total/1000).toFixed(2)+" km":Math.round(total)+" m";

 const first=points[0],last=points[points.length-1];
 const back=calcDist(last,first);
 $("toStart").textContent=back>1000?(back/1000).toFixed(2)+" km":Math.round(back)+" m";

 line.setLatLngs(points);
 startPin.setLatLng(first).addTo(map);
 mePin.setLatLng(last).addTo(map);
 if(centerMe) map.setView(last,16);
}
function startTrack(){
 if(!navigator.geolocation){$("status").textContent="Brak GPS.";return;}
 if(watchId!==null)return;
 $("status").textContent="📡 Szukam Twojej pozycji GPS...";
 navigator.geolocation.getCurrentPosition(pos=>{
  const pt=[pos.coords.latitude,pos.coords.longitude];
  if(!points.length){points.push(pt);localStorage.setItem("fp_track",JSON.stringify(points));}
  updateMap(true);
  $("status").textContent="🔴 Nagrywanie śladu aktywne! Punktów: "+points.length;
 },err=>{$("status").textContent="❌ Błąd GPS: "+err.message;},{enableHighAccuracy:true,timeout:15000});

 watchId=navigator.geolocation.watchPosition(pos=>{
  const pt=[pos.coords.latitude,pos.coords.longitude];
  if(points.length){
   const last=points[points.length-1];
   if(calcDist(last,pt)<5)return;
  }
  points.push(pt);
  localStorage.setItem("fp_track",JSON.stringify(points));
  updateMap(true);
  $("status").textContent="🔴 Zapisano punktów: "+points.length+" ("+new Date().toLocaleTimeString("pl-PL")+")";
 },null,{enableHighAccuracy:true,maximumAge:5000});
}

function stopTrack(){
 if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;$("status").textContent="⏸️ Zapis wstrzymany. Ślad zostaje na mapie.";}
}

function clearTrack(){
 if(confirm("Usunąć zapisaną trasę z mapy?")){stopTrack();points=[];localStorage.removeItem("fp_track");updateMap(false);$("status").textContent="Mapa wyczyszczona.";}
}
updateMap(true);

</script>


<style>
body.night, body.night div, body.night .card, body.night .panel, body.night .box {
 background:#000 !important;
 color:#ff3333 !important;
 border-color:#550000 !important;
}
body.night button, body.night a {
 background:#1a0000 !important;
 color:#ff4444 !important;
 border:1px solid #880000 !important;
}
body.night .leaflet-tile-pane {
 filter: invert(100%) hue-rotate(180deg) brightness(65%) contrast(130%) sepia(100%) saturate(500%) hue-rotate(-50deg) !important;
}
body.night .leaflet-control-attribution, body.night .leaflet-control-zoom a {
 background:#1a0000 !important;
 color:#ff4444 !important;
 border-color:#660000 !important;
}
</style>

<script>
function toggleMapNight(){
 document.body.classList.toggle("night");
 const on = document.body.classList.contains("night");
 document.getElementById("mapNightBtn").textContent = on ? "☀️ Dzień" : "🔦 Noc";
}
</script>

</body>
</html>

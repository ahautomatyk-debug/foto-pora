
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FotoPora</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;padding:20px}
main{max-width:480px;margin:auto}
h1{font-size:30px}
.card{background:#222;border-radius:18px;padding:18px;margin:14px 0}
.big{font-size:28px;font-weight:bold;margin:12px 0}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #444}
button{width:100%;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:bold}
.green{color:#7ee787}.yellow{color:#ffd166}.red{color:#ff7777}
small{color:#aaa}
</style>
</head>
<body>
<main>
<h1>📸 FotoPora</h1>
<small>Twój asystent fotograficzny</small>

<div class="card">
<div id="place">📍 Oczekiwanie na GPS</div>
<div class="big" id="clock">--:--</div>
</div>

<div class="card">
<div class="row"><span>🌡️ Temperatura</span><b id="temp">—</b></div>
<div class="row"><span>☁️ Zachmurzenie</span><b id="cloud">—</b></div>
<div class="row"><span>💨 Wiatr</span><b id="wind">—</b></div>
<div class="row"><span>🌧️ Opady</span><b id="rain">—</b></div>
</div>

<div class="card">
<div class="row"><span>🌅 Wschód</span><b id="rise">—</b></div>
<div class="row"><span>🌇 Zachód</span><b id="set">—</b></div>
<div class="row"><span>🟠 Złota pora rano</span><b id="morning">—</b></div>
<div class="row"><span>🟠 Złota pora wieczorem</span><b id="evening">—</b></div>
</div>

<div class="card">
<small>OCENA WARUNKÓW</small>
<div class="big" id="score">—/10</div>
<div id="verdict">Czekam na dane</div>
<p id="reason"></p>
</div>

<button onclick="start()">📍 POBIERZ GPS I POGODĘ</button>
<p id="status"><small>Wymagane połączenie z internetem.</small></p>
</main>

<script>
const el=id=>document.getElementById(id);
function time(v){
 return new Date(v).toLocaleTimeString('pl-PL',{
 hour:'2-digit',minute:'2-digit'
 });
}
function tick(){
 el('clock').textContent=new Date().toLocaleTimeString('pl-PL');
}
setInterval(tick,1000);tick();

function start(){
 if(!navigator.geolocation){
  el('status').textContent='GPS niedostępny w tej przeglądarce';
  return;
 }
 el('status').textContent='Pobieram lokalizację...';

 navigator.geolocation.getCurrentPosition(async pos=>{
  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;
  el('place').textContent=
   `📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

  el('status').textContent='Pobieram pogodę...';

  try{
   const url='https://api.open-meteo.com/v1/forecast?latitude='
    +lat+'&longitude='+lon
    +'&current=temperature_2m,precipitation,cloud_cover,wind_speed_10m'
    +'&daily=sunrise,sunset'
    +'&timezone=auto&forecast_days=1';

   const response=await fetch(url);
   if(!response.ok) throw Error('Błąd serwera pogody');
   const data=await response.json();

   const w=data.current;
   const rise=new Date(data.daily.sunrise[0]);
   const set=new Date(data.daily.sunset[0]);

   el('temp').textContent=w.temperature_2m+'°C';
   el('cloud').textContent=w.cloud_cover+'%';
   el('wind').textContent=w.wind_speed_10m+' km/h';
   el('rain').textContent=w.precipitation+' mm';

   el('rise').textContent=time(rise);
   el('set').textContent=time(set);

   const plus=new Date(rise.getTime()+50*60000);
   const minus=new Date(set.getTime()-50*60000);

   el('morning').textContent=time(rise)+' – '+time(plus);
   el('evening').textContent=time(minus)+' – '+time(set);

   let points=5;
   let reasons=[];

   if(w.precipitation===0){points++;reasons.push('brak opadów');}
   else {points-=2;reasons.push('opady');}

   if(w.wind_speed_10m<=8){points+=2;reasons.push('słaby wiatr');}
   else if(w.wind_speed_10m>20){points-=2;reasons.push('silny wiatr');}

   if(w.cloud_cover>=15&&w.cloud_cover<=65){
    points+=2;reasons.push('ciekawe zachmurzenie');
   }else if(w.cloud_cover>85){
    points-=1;reasons.push('duże zachmurzenie');
   }

   points=Math.max(1,Math.min(10,points));
   el('score').textContent=points+'/10';
   el('score').className='big '+(points>=8?'green':points>=5?'yellow':'red');

   el('verdict').textContent=
    points>=8?'🟢 WARTO FOTOGRAFOWAĆ':
    points>=5?'🟡 MOŻE BYĆ CIEKAWIE':
    '🔴 SŁABE WARUNKI';

   el('reason').textContent=reasons.join(' • ');
   el('status').textContent='Dane pobrane pomyślnie!';
  }catch(e){
   el('status').textContent='Błąd pogody: '+e.message;
  }
 },err=>{
  el('status').textContent='Błąd GPS: '+err.message;
 },{enableHighAccuracy:true,timeout:15000});
}
</script>
</body>
</html>

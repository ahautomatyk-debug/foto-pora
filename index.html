<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FotoPora</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:20px}
main{max-width:500px;margin:auto}
h1{font-size:30px;margin-bottom:5px}
.sub{color:#aaa;margin-bottom:20px}
.card{background:#202126;border-radius:18px;padding:18px;margin:14px 0}
.big{font-size:29px;font-weight:bold;margin:12px 0}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #393a40;gap:12px}
.row:last-child{border:0}
button{width:100%;padding:17px;border:0;border-radius:14px;font-size:17px;font-weight:bold;background:#fff;color:#111}
small{color:#aaa}
.green{color:#70e69a}.yellow{color:#ffd166}.red{color:#ff7777}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#303138;border-radius:12px;padding:13px}
.tile b{display:block;font-size:21px;margin-top:7px}
</style>
</head>
<div class="card">
 <div class="row"><span>🌅 Wschód słońca</span><b id="rise">—</b></div>
 <div class="row"><span>🌇 Zachód słońca</span><b id="set">—</b></div>
 <div class="row"><span>🔵 Niebieska godzina rano</span><b id="blueMorning" style="color:#64b5f6">—</b></div>
 <div class="row"><span>🟠 Złota pora rano</span><b id="morning" style="color:#ffd166">—</b></div>
 <div class="row"><span>🟠 Złota pora wieczorem</span><b id="evening" style="color:#ffd166">—</b></div>
 <div class="row"><span>🔵 Niebieska godzina wieczorem</span><b id="blueEvening" style="color:#64b5f6">—</b></div>
</div>
<div class="card">
 <small>OCENA WARUNKÓW FOTOGRAFICZNYCH</small>
 <div class="big" id="score">—/10</div>
 <div id="verdict">Czekam na dane</div>
 <p id="reason"></p>
</div>
<button onclick="start()">📍 POBIERZ GPS I POGODĘ</button>
<p id="status" style="font-size:14px;color:#bbb;line-height:1.5">Kliknij przycisk i zezwól na lokalizację.</p>
</main>
<script>
const $=id=>document.getElementById(id);
function clock(){$("clock").textContent=new Date().toLocaleTimeString("pl-PL");}
setInterval(clock,1000);clock();
function showTime(v){return v?v.slice(11,16):"—";}

async function getPlace(lat,lon){
 $("place").textContent="📍 Rozpoznaję miejscowość...";
 try{
  const res=await fetch(`https://bigdatacloud.net{lat}&longitude=${lon}&localityLanguage=pl`);
  const data=await res.json();
  const town=data.city||data.locality||data.principalSubdivision||"Twoja lokalizacja";
  $("place").textContent=`📍 ${town}, ${data.countryName||"Polska"}`;
 }catch(e){$("place").textContent=`📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`;}
}

async function getWeather(lat,lon){
 $("status").textContent="Pobieram pogodę...";
 const url=`https://open-meteo.com{lat}&longitude=${lon}&current=temperature_2m,precipitation,cloud_cover,wind_speed_10m&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
 const res=await fetch(url);
 if(!res.ok)throw Error("Nie można pobrać pogody");
 const data=await res.json();
 const w=data.current;
 $("temp").textContent=Math.round(w.temperature_2m)+"°C";
 $("cloud").textContent=w.cloud_cover+"%";
 $("wind").textContent=Math.round(w.wind_speed_10m)+" km/h";
 $("rain").textContent=w.precipitation+" mm";
 $("rise").textContent=showTime(data.daily.sunrise[0]);
 $("set").textContent=showTime(data.daily.sunset[0]);
 const sr=new Date(data.daily.sunrise[0]),ss=new Date(data.daily.sunset[0]);
 const bm1=new Date(sr.getTime()-35*60000),bm2=new Date(sr.getTime()-10*60000);
 const gm2=new Date(sr.getTime()+50*60000),ge1=new Date(ss.getTime()-50*60000);
 const be1=new Date(ss.getTime()+10*60000),be2=new Date(ss.getTime()+35*60000);
 const fmt=d=>d.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit",timeZone:data.timezone});
 $("blueMorning").textContent=fmt(bm1)+" – "+fmt(bm2);
 $("morning").textContent=fmt(sr)+" – "+fmt(gm2);
 $("evening").textContent=fmt(ge1)+" – "+fmt(ss);
 $("blueEvening").textContent=fmt(be1)+" – "+fmt(be2);
 const now=new Date();
 if(now<sr)$("countdown").textContent="⏳ Złota pora rano startuje o "+fmt(sr);
 else if(now<ge1)$("countdown").textContent="⏳ Złota pora wieczorem startuje o "+fmt(ge1);
 else if(now<=ss)$("countdown").textContent="🔥 TRWA ZŁOTA PORA WIECZOREM (do "+fmt(ss)+")";
 else $("countdown").textContent="🌙 Na dziś złote godziny już minęły";
 $("weatherTime").textContent="Aktualizacja: "+new Date().toLocaleTimeString("pl-PL");
 calculateScore(w);
}

function calculateScore(w){
 let pts=5,r=[];
 if(w.precipitation===0){pts+=1;r.push("brak opadów");}else{pts-=2;r.push("opady");}
 if(w.wind_speed_10m<=8){pts+=2;r.push("słaby wiatr");}else if(w.wind_speed_10m>20){pts-=2;r.push("silny wiatr");}
 if(w.cloud_cover>=15&&w.cloud_cover<=65){pts+=2;r.push("ciekawe zachmurzenie");}else if(w.cloud_cover>85){pts-=1;r.push("duże zachmurzenie");}
 pts=Math.max(1,Math.min(10,pts));
 $("score").textContent=pts+"/10";
 $("score").className="big "+(pts>=8?"green":pts>=5?"yellow":"red");
 $("verdict").textContent=pts>=8?"🟢 WARTO BRAĆ APARAT":pts>=5?"🟡 MOŻE BYĆ CIEKAWIE":"🔴 SŁABE WARUNKI";
 $("reason").textContent=r.join(" • ");
}

function start(){
 if(!navigator.geolocation){$("status").textContent="Brak GPS w przeglądarce.";return;}
 $("status").textContent="Pobieram lokalizację GPS...";
 navigator.geolocation.getCurrentPosition(async pos=>{
  const lat=pos.coords.latitude,lon=pos.coords.longitude;
  $("coordinates").textContent=`GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  await getPlace(lat,lon);
  try{await getWeather(lat,lon);$("status").textContent="✅ GPS i pogoda pobrane prawidłowo.";}
  catch(e){$("status").textContent="❌ Błąd pogody: "+e.message;}
 },err=>{$("status").textContent="❌ Błąd GPS: "+err.message;},{enableHighAccuracy:true,timeout:20000,maximumAge:60000});
}
</script>
</body>
</html>
